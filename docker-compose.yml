services:
  # Database: PostgreSQL Container
  db:
    build:
      context: ./docker/db
      dockerfile: Dockerfile.dev
    container_name: agon_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: agon
      POSTGRES_PASSWORD: agon
      POSTGRES_DB: agon
      # Flag para inyectar (o no) el seed de datos de prueba en la primera
      # inicialización del volumen. Uso:
      #   docker compose up -d --build                 # solo esquema
      #   AGON_SEED=true docker compose up -d --build  # esquema + seed
      AGON_SEED: ${AGON_SEED:-false}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Wrapper que decide si se inyecta el seed (ver docker/db/init-seed.sh)
      - ./docker/db/init-seed.sh:/docker-entrypoint-initdb.d/00-init-seed.sh:ro
      - ./backend/src/sql/1-PostgreSQLCreateTables.sql:/scripts/1-PostgreSQLCreateTables.sql:ro
      - ./backend/src/sql/3-SeedData.sql:/scripts/3-SeedData.sql:ro
      # Crea la BD de TEST independiente (agon_test) para que `mvn test` no borre el seed de desarrollo
      - ./docker/db/init-test-db.sql:/docker-entrypoint-initdb.d/99-init-test-db.sql:ro
    networks:
      - agon_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U agon -d agon" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - "com.agon.environment=development"
      - "com.agon.service=database"

  # Backend: Java Spring Boot API
  backend:
    # Nombre de imagen EXPLÍCITO (agon-backend:dev) para que NO colisione con
    # el de producción (agon-backend:prod). Si ambos comparten tag (agon-app-backend),
    # un `up --build` de dev y un `up -f docker-compose.prod.yml` sin --build
    # recrean el contenedor prod con la imagen DEV.
    image: agon-backend:dev
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.dev
    container_name: agon_backend
    restart: unless-stopped
    mem_limit: 1500m
    mem_reservation: 512m
    environment:
      # Sin override de SPRING_DATASOURCE_URL: application.yml (filtrado) apunta a
      # jdbc:postgresql://db/agon para el servidor de desarrollo, y application-test.yml
      # (perfil "test") apunta a agon_test. Un env var aquí sobrescribiría el perfil de
      # test y los tests correrían contra la BD de desarrollo (agon), fallando con
      # "column partidosEmpatados does not exist" tras migraciones del esquema.
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
      SPRING_DEVTOOLS_RESTART_POLL_INTERVAL: "2s"
      SPRING_DEVTOOLS_RESTART_QUIET_PERIOD: "1s"
      MAVEN_OPTS: "-Xmx512m -XX:MaxMetaspaceSize=256m"
      JAVA_TOOL_OPTIONS: "-Xmx512m -XX:MaxMetaspaceSize=256m -Duser.language=es -Duser.country=ES"
      # Client ID de Google para validar ID Tokens en /users/google.
      # Viene del .env de la raíz (GOOGLE_CLIENT_ID).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    volumes:
      - ./backend:/app
      - maven_cache:/root/.m2
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - agon_network
    labels:
      - "com.agon.environment=development"
      - "com.agon.service=backend"

  # Frontend: React/Vite Application
  frontend:
    # Imagen explícita de desarrollo, distinta de agon-frontend:prod.
    image: agon-frontend:dev
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile.dev
    container_name: agon_frontend
    restart: unless-stopped
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      # Client ID de Google para mostrar el botón "Sign in with Google".
      # Vite lo expone al cliente con prefijo VITE_ (viene del .env de la raíz).
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    volumes:
      # Synchronize source code in real-time
      - ./frontend:/app
      # Keep container node_modules isolated from the host
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - agon_network
    labels:
      - "com.agon.environment=development"
      - "com.agon.service=frontend"

networks:
  agon_network:
    driver: bridge
    name: agon_dev_network

volumes:
  postgres_data:
    name: agon_dev_postgres_data
  maven_cache:
    name: agon_dev_maven_cache