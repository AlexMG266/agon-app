# ============================================================
# Configuración de Nginx para PRODUCCIÓN (Agón App)
#
# Nginx dentro del contenedor del frontend actúa SOLO como
# servidor de archivos estáticos de la SPA. NO es reverse proxy.
#
# El enrutado y el HTTPS los gestiona el proxy externo del host
# (Nginx Proxy Manager u otro), que reenvía hacia:
#   - Frontend:  http://127.0.0.1:8081
#   - Backend:   http://127.0.0.1:8080
#
# El frontend apunta a la API mediante VITE_BACKEND_URL (build
# arg). Ejemplos válidos:
#   - Subdominio dedicado (recomendado con NPM):
#       VITE_BACKEND_URL=https://api.tudominio.com
#   - Misma ruta /api en el mismo dominio (requiere que el proxy
#     externo enrute /api/* hacia el backend):
#       VITE_BACKEND_URL=/api
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Archivos estáticos con hash (assets de Vite) ---
    # Cachear durante 1 año: los nombres de los assets incluyen hash
    # del contenido, así que son inmutables.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- SPA: cualquier ruta de navegación cae a index.html ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Headers de seguridad (hardening) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
