# ============================================================
# Perfil de PRODUCCIÓN (se activa con SPRING_PROFILES_ACTIVE=prod)
#
# Endurece la configuración de cara al despliegue:
#   - Desactiva el SQL debug de Hibernate (evita exponer datos/consultas
#     sensibles en los logs).
#   - Desactiva Spring DevTools (recarga en caliente, innecesaria y
#     peligrosa en producción).
#   - Desactiva Swagger/OpenAPI (no exponer la documentación de la API
#     públicamente).
# ============================================================
logging:
  level:
    org:
      hibernate:
        SQL: warn
        type:
          descriptor:
            sql:
              BasicBinder: warn

server:
  # Endpoint base de la API. En producción todos los controladores responden
  # bajo /api: /api/users/login, /api/teams, /api/tournaments, etc.
  # El contenedor de servlets elimina el prefijo /api antes de enrutar, por lo
  # que las reglas de Spring Security y las rutas de los controladores siguen
  # siendo /users/login, /teams, ... SIN necesidad de variantes /api.
  # En desarrollo/tests no se define context-path, así que las rutas quedan en /
  # (igual que siempre).
  servlet:
    context-path: /api

spring:
  devtools:
    restart:
      enabled: false

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
