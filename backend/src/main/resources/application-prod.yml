# ============================================================
# Perfil de PRODUCCIÓN (se activa con SPRING_PROFILES_ACTIVE=prod)
#
# Endurece la configuración de cara al despliegue:
#   - Desactiva el SQL debug de Hibernate (evita exponer datos/consultas
#     sensibles en los logs).
#   - Desactiva Spring DevTools (recarga en caliente, innecesaria y
#     peligrosa en producción).
#   - Desactiva Swagger/OpenAPI (no exponer la documentación de la API
#     públicamente).
# ============================================================
logging:
  level:
    org:
      hibernate:
        SQL: warn
        type:
          descriptor:
            sql:
              BasicBinder: warn

spring:
  # Endpoint base de la API. En producción todos los controladores responden
  # bajo /api: /api/users/login, /api/teams, /api/tournaments, etc.
  # Así el reverse proxy externo (NPM) puede reenviar /api/* -> 127.0.0.1:8080
  # SIN eliminar el prefijo (el backend ya sirve la ruta /api).
  # En desarrollo/tests (servlet path "/") las rutas quedan como /users, /teams...
  mvc:
    servlet:
      path: /api
  devtools:
    restart:
      enabled: false

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
