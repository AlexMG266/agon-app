logging:
  level:
    org:
      hibernate:
        SQL: debug
spring:
  datasource:
    url: @dataSource.url@
    username: @dataSource.user@
    password: @dataSource.password@
    hikari:
      maximum-pool-size: 4
  devtools:
    restart:
      enabled: true
      poll-interval: 2s
      quiet-period: 1s
  jackson:
    default-property-inclusion: NON_NULL
  jpa:
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  # --- Flyway: migraciones de esquema de BD automáticas al arrancar ---
  # Al iniciar el backend, Flyway aplica las migraciones pendientes de
  # src/main/resources/db/migration (V1__baseline.sql, V2__google_sign_in.sql, ...).
  # Así, tras `git pull` + `docker compose up -d --build`, el esquema se actualiza
  # solo, sin ejecutar migraciones a mano (también en BDs ya existentes).
  flyway:
    # Si la BD ya tiene datos/esquema creado por los scripts de inicialización
    # (docker-entrypoint-initdb.d / sql-maven-plugin) pero no tiene la tabla de
    # historial de Flyway, la toma como punto de partida (baseline en V1) en
    # lugar de fallar. NO borra nada.
    baseline-on-migrate: true
    # Version inicial del baseline: las BDs existentes se marcan en V1 y las
    # migraciones posteriores (V2+) se aplican automáticamente.
    baseline-version: 1
    # Localización por defecto de las migraciones (carpeta estándar de Flyway).
    locations: classpath:db/migration
  messages:
    basename: messages
    fallback-to-system-locale: true

springdoc:
  swagger-ui:
    path: /docs
    operationsSorter: method
  api-docs:
    path: /api-docs

project:
  jwt:
    # Secreto JWT inyectado desde variable de entorno (nunca hardcodeado).
    # En desarrollo se mantiene el valor por defecto; en producción debe
    # venir de .env (JWT_SIGN_KEY) con un valor fuerte.
    signKey: ${JWT_SIGN_KEY:W27sJe29ATI7dR3juV5lWkT9WgS2C8RT}
    expirationMinutes: ${JWT_EXPIRATION_MINUTES:1440}
  cors:
    # Orígenes permitidos por CORS, separados por coma.
    # En desarrollo el frontend (localhost:5173) y el backend (localhost:8080)
    # son orígenes distintos, así que el default cubre ambos.
    # En producción se sobrescribe con la variable CORS_ALLOWED_ORIGINS
    # (p. ej. https://app.tudominio.com). Como frontend y API usan dominios
    # distintos en producción, CORS siempre se aplica y este valor es obligatorio.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
  google:
    # Client ID de Google OAuth 2.0 (formato xxx.apps.googleusercontent.com).
    # En desarrollo se puede dejar vacío (integración desactivada) o poner el
    # Client ID real creado en Google Cloud Console. En producción se inyecta
    # desde .env con la variable GOOGLE_CLIENT_ID.
    client-id: ${GOOGLE_CLIENT_ID:}
